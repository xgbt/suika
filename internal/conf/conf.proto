syntax = "proto3";
package kratos.api;

option go_package = "suika/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Recorder recorder = 3;
}

// Recorder configures the Bilibili live recorder: where recordings land
// and the deployment-dependent knobs. Behavioral tuning (segment length,
// reconnect policy, poll intervals, stream quality) is deliberately not
// configurable; those defaults live in code (biz/data layers). Rooms to
// watch live in the sqlite database (rooms table), not in config files.
// The login credential is obtained via web QR login and stored in the
// sqlite database (credentials table); it is the only cookie source.
message Recorder {
  // Deprecated: the login cookie is no longer read from config. It is
  // obtained via web QR login and persisted in the database. This field
  // is retained (and ignored) for backwards compatibility.
  string cookie = 2 [deprecated = true];
  // Directory recordings are written under. Default ./recordings.
  string record_root = 3;
  // Merge the recorded FLV segments of a finished session into a single
  // FLV file (pure Go, no external tools). Optional so an explicit false
  // (keep the separate segments) is distinguishable from unset (unset
  // defaults to true).
  optional bool merge_enabled = 8;
    reserved 1, 4, 5, 6, 7, 9, 10;
  reserved "fallback_poll_interval", "quality_qn", "segment_minutes",
      "danmaku", "reconnect", "remux_enabled", "max_concurrent";
}

message Server {
  message HTTP {
    string addr = 2;
    reserved 1, 3;
    reserved "network", "timeout";
  }
  message GRPC {
    string addr = 2;
    reserved 1, 3;
    reserved "network", "timeout";
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string source = 2;
    reserved 1;
    reserved "driver";
  }
  Database database = 1;
  reserved 2;
  reserved "redis";
}
