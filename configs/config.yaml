# 只保留真正随部署环境变化的配置项；行为调优（分段时长、重连策略、
# 轮询间隔、清晰度等）不做配置，默认值在代码里（见
# docs/design/bili-recorder.md 第 7 节）。
server:
  http:
    addr: 0.0.0.0:8000
  grpc:
    addr: 0.0.0.0:9000
data:
  database:
    source: ./data/suika.db
recorder:
  # 已废弃：登录凭据由 Web 扫码登录写入数据库（credentials 表），
  # 此字段不再被读取，保留仅为向后兼容。
  cookie: ""
  record_root: ./recordings
  max_concurrent: 10
  # 本机未安装 ffmpeg 时必须保持 false；装了 ffmpeg 后再改 true。
  # 程序会在启动时探测 ffmpeg，开启转封装但 ffmpeg 缺失会直接启动失败。
  remux_enabled: false
