# 复制本文件为 credentials.yaml 再填入真实 cookie:
#   cp configs/credentials.example.yaml configs/credentials.yaml
#
# cookie 获取方式:浏览器登录 live.bilibili.com 后,从 DevTools
# (Application/Storage -> Cookies)复制完整 cookie,需包含 SESSDATA。
#
# credentials.yaml 已被 gitignore,切勿提交真实凭据。
# 没有 cookie 也能跑,但拿不到原画,且更容易触发风控。
#
# kratos 会把 -conf 目录下所有 yaml 合并进 Bootstrap,
# 因此这里只需要写 config.yaml 中留空的敏感字段。
recorder:
  cookie: "SESSDATA=xxx; buvid3=xxx; ..."
