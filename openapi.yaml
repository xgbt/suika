openapi: 3.0.3
info:
    title: RoomService API
    description: |-
        RoomService manages the monitored rooms and their live status. The
         persisted fields (room_id, name, enabled, create_time, update_time) are
         stored in the database; the runtime fields (live_status, record_status,
         current_file, bytes_written, session_started_at, last_error) are merged
         in from the in-memory room registry on Get/List and carry default values
         on Create/Update/Delete responses.
    version: 0.0.1
paths:
    /v1/rooms/create:
        post:
            tags:
                - RoomService
            description: |-
                CreateRoom registers a new room and returns the stored record with
                 create_time and update_time populated and the runtime fields set to
                 their defaults.
                 Returns INVALID_ARGUMENT if the request payload fails validation, or
                 ALREADY_EXISTS if a room with the same room_id is already registered.
            operationId: RoomService_CreateRoom
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/room.v1.Room'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/room.v1.Room'
    /v1/rooms/list:
        get:
            tags:
                - RoomService
            description: |-
                ListRooms returns a page of rooms, optionally filtered and ordered,
                 with the runtime state merged in from the room registry.
                 Use the next_page_token from RoomSet to retrieve subsequent pages.
                 Returns INVALID_ARGUMENT if filter, order_by, or page_token are malformed.
            operationId: RoomService_ListRooms
            parameters:
                - name: pageSize
                  in: query
                  description: |-
                    Optional. Maximum number of rooms to return in a single page.
                     The server applies a default of 20 when unset or out of range.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Optional. Token from a previous response's next_page_token used to fetch
                     the next page. Leave empty to request the first page.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Optional. The standard list filter. Only persisted fields are
                     supported; runtime fields are server-populated and not filterable.
                     Supported fields:
                        * `room_id` (i.e. `room_id=123`)
                        * `name` (i.e. `name:"streamer"`)
                        * `enabled` (i.e. `enabled` or `NOT enabled`)
                        * `create_time` range (i.e. `create_time>="2026-01-01T00:00:00Z"`)
                        * `update_time` range (i.e. `update_time>="2026-01-01T00:00:00Z"`)
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. A comma-separated list of fields to order by. Only persisted
                     fields are supported; runtime fields are not orderable.
                     Supported fields:
                        * `room_id`
                        * `name`
                        * `enabled`
                        * `create_time`
                        * `update_time`
                     Append ` desc` to a field for descending order, e.g. `create_time desc`.
                     Defaults to ascending order when no direction is supplied.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/room.v1.RoomSet'
    /v1/rooms/update:
        put:
            tags:
                - RoomService
            description: |-
                UpdateRoom applies a partial update to an existing room using a
                 FieldMask. Only `name` and `enabled` may be changed; `room_id` is
                 immutable. Fields not listed in update_mask are left unchanged.
                 Returns NOT_FOUND if the target room does not exist, or
                 INVALID_ARGUMENT if update_mask references unsupported fields.
            operationId: RoomService_UpdateRoom
            parameters:
                - name: updateMask
                  in: query
                  description: |-
                    Set of field paths in room to overwrite. Only `name` and `enabled` are
                     supported; fields not listed are left unchanged.
                  schema:
                    type: string
                    format: field-mask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/room.v1.Room'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/room.v1.Room'
    /v1/rooms/{roomId}:
        get:
            tags:
                - RoomService
            description: |-
                GetRoom returns one room by its platform room id with the runtime
                 state merged in from the room registry.
                 Returns NOT_FOUND if no room exists with the supplied room id.
            operationId: RoomService_GetRoom
            parameters:
                - name: roomId
                  in: path
                  description: Platform room id of the room to retrieve.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/room.v1.Room'
        delete:
            tags:
                - RoomService
            description: |-
                DeleteRoom permanently removes a room by its platform room id.
                 Returns NOT_FOUND if no room exists with the supplied room id.
            operationId: RoomService_DeleteRoom
            parameters:
                - name: roomId
                  in: path
                  description: Platform room id of the room to delete.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
